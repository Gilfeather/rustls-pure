name: CI

# Formatting, clippy, the unit, handshake and property tests, the doc-tests and the docs, on
# Linux, macOS and Windows; and that nothing in the dependency tree builds C or assembly. On
# pull requests that change the code or what it is built from: the README, the changelog and the
# other documents alone run nothing. A push to main runs nothing: what is merged has passed as a
# pull request. The interoperability tests, the builds for other targets, the newest rustls and
# the MSRV are in interop.yml, the timing tests in constant-time.yml, the proofs in kani.yml.
#
# The workflows filter by path, so a pull request that changes none of their files gets no run
# of them at all, not a skipped one: there is no aggregate check to require before merging, as
# a required check would wait forever on such a pull request.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# On a pull request a newer push makes an older run redundant; a run by hand is a group of its
# own and runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Check formatting
      if: runner.os == 'Linux'
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --locked -- -D warnings

    # The timing tests are `#[ignore]`d here: they need a release build and a quiet machine
    # (constant-time.yml)
    - name: Run tests
      run: cargo test --locked

    - name: Build the docs
      if: runner.os == 'Linux'
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps --locked

  # What a user builds: no C or assembly, so none of the crates that compile them
  pure-rust:
    name: No C or assembly
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable

    - name: Check that no C dependency is built
      shell: bash
      run: |
        deps=$(cargo tree --locked -e normal,build --prefix none --format '{p}' | sort -u)
        echo "$deps"
        if echo "$deps" | grep -E '^(cc|cmake|ring|aws-lc-rs|aws-lc-sys|openssl-sys) '; then
          echo "::error::rustls-pure now builds C code"
          exit 1
        fi
